 
name: Shadow System Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          find . -type f -name '*.zip' -exec unzip -o {} -d extracted \;

          WRAPPER=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found."
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-System-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
