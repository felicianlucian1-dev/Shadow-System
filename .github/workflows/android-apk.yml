
name: Shadow System Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p extracted
          find . -maxdepth 2 -type f -name '*.zip' -exec unzip -o {} -d extracted \;

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: extracted/ShadowSystemRealLife
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-System-APK
          path: extracted/ShadowSystemRealLife/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
 
